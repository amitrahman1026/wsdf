name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    strategy:
      matrix:
        os: [ubuntu-latest]
        rust: [stable]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v3

      - name: Set up wireshark dependencies (optimized)
        run: |
          # Install only essential dependencies, skip GUI packages
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            pkg-config \
            libwireshark-dev \
            libwiretap-dev \
            libwsutil-dev \
            libglib2.0-dev \
            libgcrypt20-dev \
            libpcap-dev \
            tshark
          # Skip the full debian-setup.sh which includes GUI dependencies

      - name: Verify wireshark installation
        run: |
          echo "Checking Wireshark installation..."
          pkg-config --exists wireshark && echo "pkg-config: OK" || echo "pkg-config: Not found"
          pkg-config --modversion wireshark 2>/dev/null || echo "Version not available via pkg-config"
          which tshark && echo "tshark: Available" || echo "tshark: Not found"
          ls -la /usr/lib/x86_64-linux-gnu/lib*wireshark* 2>/dev/null || echo "System libraries not found"

      - name: Set up Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Check formatting
        uses: actions-rs/cargo@v1
        with:
          command: fmt
          args: --check

      - name: Run clippy
        uses: actions-rs/cargo@v1
        with:
          command: clippy
          args: --all-targets --no-deps -- -Dwarnings

      - name: Build everything
        uses: actions-rs/cargo@v1
        with:
          command: build
          args: --all-targets

      - name: Run unit tests
        uses: actions-rs/cargo@v1
        with:
          command: test
          args: --lib

      - name: Run integration tests
        uses: actions-rs/cargo@v1
        with:
          command: test
          args: --test integration_test

      - name: Build examples
        uses: actions-rs/cargo@v1
        with:
          command: build
          args: --examples

      - name: Verify plugin artifacts
        run: |
          echo "Checking built plugin artifacts..."
          ls -la target/debug/examples/ || echo "No examples built"
          if [ -f target/debug/examples/libbuilder.so ]; then
            echo "Plugin built successfully"
            file target/debug/examples/libbuilder.so
            ldd target/debug/examples/libbuilder.so || echo "ldd failed (expected if libs not in path)"
          else
            echo "Plugin not found"
          fi
